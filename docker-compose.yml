services:
  sap-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sap-backend-img:latest
    container_name: sap-backend
    ports:
      - "8081:8082"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    networks:
      - network-battilana
    restart: unless-stopped
networks:
  network-battilana:
    external: true